# DocuFlow AI — production stack on a single host (see docs/deployment.md)
#
#   ./deploy/deploy.sh            # build, migrate, (re)start everything
#
# Only Caddy publishes ports. Everything else is reachable solely on the
# internal network; Caddy terminates HTTPS (automatic Let's Encrypt certificates)
# and routes:
#   APP_ADDRESS  /api/*  → api:3001     (direct, so chat streaming isn't buffered)
#   APP_ADDRESS  *       → web:3000
#   S3_ADDRESS   *       → storage:8333 (SeaweedFS S3; presigned browser uploads/downloads)
#
# Values come from .env.production (create it with ./deploy/init-env.sh).

name: docuflow

x-app: &app
  image: docuflow:${IMAGE_TAG:-latest}
  restart: unless-stopped
  networks: [internal]
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://docuflow:${POSTGRES_PASSWORD}@postgres:5432/docuflow
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    STORAGE_ENDPOINT: http://storage:8333
    STORAGE_PUBLIC_ENDPOINT: ${S3_URL}
    STORAGE_REGION: us-east-1
    STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY}
    STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY}
    STORAGE_BUCKET: docuflow
    STORAGE_FORCE_PATH_STYLE: 'true'
    JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    AI_CREDENTIALS_ENCRYPTION_KEY: ${AI_CREDENTIALS_ENCRYPTION_KEY}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ALLOWED_ORIGINS: ${APP_URL}

services:
  # ── Data ────────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: docuflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: docuflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docuflow -d docuflow']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    # noeviction: BullMQ jobs must never be silently evicted
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  storage:
    # S3-compatible object storage (MinIO no longer publishes community images)
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    networks: [internal]
    environment:
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      APP_URL: ${APP_URL}
    # The S3 identity file is written from env on every start, so secrets live only in .env.production
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        printf '{"identities":[{"name":"docuflow","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' \
          "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -volume.max=0 -master.volumeSizeLimitMB=1024 \
          -s3 -s3.port=8333 -s3.config=/tmp/s3.json -s3.allowedOrigins="$$APP_URL"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz']
      interval: 5s
      timeout: 5s
      retries: 30

  # ── One-shot setup ──────────────────────────────────────────────────────
  storage-init:
    <<: *app
    restart: 'no'
    command: ['node', '/app/deploy/storage-init.mjs']
    environment:
      <<: *app-env
      APP_URL: ${APP_URL}
    depends_on:
      storage: { condition: service_healthy }

  migrate:
    <<: *app
    restart: 'no'
    working_dir: /app/packages/database
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    depends_on:
      postgres: { condition: service_healthy }

  # ── Apps ────────────────────────────────────────────────────────────────
  api:
    <<: *app
    working_dir: /app/apps/api
    command: ['node', 'dist/main']
    environment:
      <<: *app-env
      PORT: '3001'
      # Only Caddy (on this network) may set X-Forwarded-For
      TRUST_PROXY: 172.28.0.0/16
      # 1 = production limits. Only raise it to run the browser test suite against this stack.
      RATE_LIMIT_MULTIPLIER: ${RATE_LIMIT_MULTIPLIER:-1}
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app
    working_dir: /app/apps/worker
    command: ['node', 'dist/main']
    environment:
      <<: *app-env
      WORKER_PORT: '3002'
    depends_on:
      migrate: { condition: service_completed_successfully }
      storage-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    <<: *app
    working_dir: /app/apps/web
    command: ['node_modules/.bin/next', 'start', '--port', '3000']
    environment:
      NODE_ENV: production
    depends_on:
      api: { condition: service_healthy }

  # ── Edge ────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [internal]
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      APP_ADDRESS: ${APP_ADDRESS}
      S3_ADDRESS: ${S3_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
      - storage

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
  redis-data:
  storage-data:
  caddy-data:
  caddy-config:
